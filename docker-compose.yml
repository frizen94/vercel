services:
  # Banco de dados PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: nexustasks_postgres
    environment:
      POSTGRES_DB: nexustasks_db
      POSTGRES_USER: nexustasks_user
      POSTGRES_PASSWORD: nexustasks_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - nexustasks_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexustasks_user -d nexustasks_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Aplicação Node.js
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexustasks_app
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://nexustasks_user:nexustasks_password@postgres:5432/nexustasks_db
      - PORT=5000
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - ./public/uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexustasks_network
    command: npm run dev
    restart: unless-stopped

volumes:
  postgres_data:
  app_node_modules:

networks:
  nexustasks_network:
    driver: bridge